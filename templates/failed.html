<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Failed — PayFlow</title>

    <link rel="stylesheet" href="/static/css/style.css">

</head>

<body>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>


    <main class="result-wrapper">

        <div class="result-card failed-card">

            <div class="result-icon failed-icon">
                ×
            </div>

            <div class="eyebrow">
                PAYMENT NOT COMPLETED
            </div>

            <h1>
                Payment failed
            </h1>

            <p>
                The test payment could not be completed.
                You can return to the store and try again.
            </p>


            <div class="failed-notice">

                <span>!</span>

                <div>
                    No successful payment was verified.
                </div>

            </div>


            <a href="/" class="buy-button result-button">

                <span>Try again</span>

                <span class="arrow">→</span>

            </a>

        </div>

    </main>

</body>

</html>
